# Security Review Triggers
# Declares when security expertise is relevant for dynamic skill selection

review-capable: true
scope-minimum: medium
pillar-binding: security

# When scope >= medium, security is always included
# When security pillar selected in 0-scope.md, security is always included
# Otherwise, content detection determines relevance

triggers:
  files:
    - "**/auth/**"
    - "**/login/**"
    - "**/signup/**"
    - "**/password/**"
    - "**/payment/**"
    - "**/checkout/**"
    - "**/api/v*/auth*"
    - "**/middleware/auth*"
    - "**/*secret*"
    - "**/*credential*"
  patterns:
    - "password"
    - "token"
    - "secret"
    - "api[_-]?key"
    - "bcrypt"
    - "argon2"
    - "jwt\\."
    - "crypto\\."
    - "encrypt"
    - "decrypt"
    - "hash\\("
    - "verify\\("
    - "Bearer\\s+"
    - "Authorization"
    - "cookie\\("
    - "session"
    - "cors"
    - "csrf"
    - "xss"
    - "sanitize"
