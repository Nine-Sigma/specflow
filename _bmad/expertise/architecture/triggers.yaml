# Architecture Review Triggers
# Declares when architecture expertise is relevant for dynamic skill selection

review-capable: true
scope-minimum: large
pillar-binding: architect

# When scope >= large, architecture review is always included
# When architect pillar selected in 0-scope.md, architecture is always included
# Otherwise, content detection determines relevance

triggers:
  files:
    - "**/config/**"
    - "**/infrastructure/**"
    - "**/terraform/**"
    - "**/kubernetes/**"
    - "**/docker/**"
    - "docker-compose*"
    - "Dockerfile*"
    - "*.yaml"
    - "*.yml"
    - "**/api/**"
    - "**/routes/**"
    - "**/middleware/**"
    - "**/services/**"
    - "**/providers/**"
  patterns:
    - "import\\s+.*from\\s+['\"]@/"
    - "require\\(['\"]@/"
    - "microservice"
    - "gateway"
    - "queue"
    - "pubsub"
    - "kafka"
    - "rabbitmq"
    - "redis"
    - "cache\\("
    - "CDN"
    - "loadbalancer"
    - "circuit[_-]?breaker"
    - "retry[_-]?policy"
    - "rate[_-]?limit"
    - "singleton"
    - "factory\\("
    - "dependency[_-]?injection"
