# sprint-status.yaml - Work item tracker for SpecFlow features
# Created by PM after triage for scope >= small
#
# Status values: pending | in-progress | done | skipped
# Optional items (security, cost) marked with skip comment
# Stories and qa_tickets populated later in workflow

feature: {slug}
created: {iso-timestamp}
updated: {iso-timestamp}
scope: {scope_level}
status: in-progress

# Analysis phase work items
analysis:
  - id: scope
    agent: analyst
    output: 0-scope.md
    status: pending
    depends_on: []

  - id: codebase
    agent: analyst
    output: 1.5-codebase-constraints.md
    status: pending
    depends_on: [scope]

  - id: spec
    agent: analyst
    output: 1-spec.md
    status: pending
    depends_on: [scope]

  - id: architecture
    agent: architect
    output: 2-architecture.md
    status: pending
    depends_on: [spec, codebase]

  - id: security
    agent: security
    output: 3-security.md
    status: pending
    depends_on: [architecture]
    # Skip if security pillar not in scope

  - id: cost
    agent: cost
    output: 4-cost.md
    status: pending
    depends_on: [architecture]
    # Skip if cost pillar not in scope

  - id: tea
    agent: tea
    output: 5-test-plan.md
    status: pending
    depends_on: [architecture]

  - id: requirements-lock
    agent: pm
    output: 5-requirements-lock.md
    status: pending
    depends_on: [spec, architecture, tea]
    # Depends on all required pillars

# Dev stories (populated after requirements-lock approved)
stories: []

# QA tickets (populated after dev stories complete)
qa_tickets: []
